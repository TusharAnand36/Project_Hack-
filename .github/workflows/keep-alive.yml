# Free-tier hosts sleep after ~15 minutes idle; ping /health so the first judge request is fast.
# Set the repository variable API_HEALTH_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://upcycle-compass-api.onrender.com/health. Without it the job does nothing.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "API_HEALTH_URL not set; skipping"; exit 0; fi
          curl -fsS --max-time 60 --retry 2 "$URL"
