[project]
name = "upcycle-compass"
version = "0.0.1"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["engine", "."]
testpaths = ["engine/compass/tests", "api/tests"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # black owns line length; long user-facing strings stay readable

[tool.ruff.lint.isort]
known-first-party = ["compass", "api"]
